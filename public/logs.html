<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>naviList</title>
  <link rel="icon" href="/assets/favicon.webp" type="image/webp" />
  <link rel="stylesheet" href="/css/main.css" />
  <script>document.documentElement.setAttribute("data-theme", localStorage.getItem("navilist_theme") || "auto");</script>
</head>
<body>
  <nav>
    <a href="/playlists" class="nav-brand">
      <img src="/assets/naviList_icon.png" class="nav-brand-icon" alt="" />
      naviList
    </a>
    <ul>
      <li><a href="/playlists">Playlists</a></li>
      <li><a href="/status">Services</a></li>
      <li><a href="/settings">Settings</a></li>
      <li><a href="/logs" class="active">Logs</a></li>
    </ul>
    <select id="themeSelect" class="theme-select" aria-label="Theme">
      <option value="auto">Auto</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </nav>
  <main>
    <div class="status-header">
      <h1>Logs</h1>
      <div class="status-actions">
        <label class="log-level-label" for="levelSelect">Level</label>
        <select id="levelSelect" class="log-level-select">
          <option value="debug">Debug</option>
          <option value="info" selected>Info</option>
          <option value="warn">Warn</option>
          <option value="error">Error</option>
        </select>
        <button class="btn btn-secondary" id="autoRefreshBtn">⏸ Pause</button>
        <button class="btn btn-secondary" id="refreshBtn">Refresh</button>
        <button class="btn btn-secondary" id="clearBtn">Clear log</button>
      </div>
    </div>
    <p class="status-updated" id="logMeta">—</p>

    <div class="log-viewer" id="logViewer">
      <div class="log-empty" id="logEmpty">Loading...</div>
    </div>
  </main>
  <script>
    let autoRefreshTimer = null;
    let autoRefreshRunning = true;
    const AUTO_REFRESH_MS = 2000;

    function levelClass(line) {
      if (line.includes('[ERROR]')) return 'log-error';
      if (line.includes('[WARN ]')) return 'log-warn';
      if (line.includes('[DEBUG]')) return 'log-debug';
      return 'log-info';
    }

    function esc(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    async function loadLogs() {
      const level = document.getElementById('levelSelect').value;
      try {
        const res  = await fetch(`/logs/api/tail?lines=300&level=${level}`);
        const data = await res.json();

        const viewer = document.getElementById('logViewer');
        const empty  = document.getElementById('logEmpty');
        const meta   = document.getElementById('logMeta');

        if (!data.ok || !data.lines.length) {
          empty.style.display = '';
          empty.textContent   = data.lines?.length === 0 ? 'No log entries.' : `Error: ${data.error}`;
          meta.textContent    = '—';
          return;
        }

        empty.style.display = 'none';
        meta.textContent = `${data.lines.length} of ${data.total} entries · ${new Date().toLocaleTimeString()}`;

        const atBottom = viewer.scrollHeight - viewer.scrollTop - viewer.clientHeight < 40;

        viewer.innerHTML = data.lines.map(line =>
          `<div class="log-line ${levelClass(line)}">${esc(line)}</div>`
        ).join('');

        if (atBottom) viewer.scrollTop = viewer.scrollHeight;
      } catch (e) {
        document.getElementById('logEmpty').textContent = '✗ Request failed';
      }
    }

    async function loadLevel() {
      try {
        const res  = await fetch('/logs/api/level');
        const data = await res.json();
        if (data.ok) document.getElementById('levelSelect').value = data.level;
      } catch (e) {}
    }

    function startAutoRefresh() {
      stopAutoRefresh();
      autoRefreshRunning = true;
      document.getElementById('autoRefreshBtn').textContent = '⏸ Pause';
      autoRefreshTimer = setInterval(loadLogs, AUTO_REFRESH_MS);
    }

    function stopAutoRefresh() {
      if (autoRefreshTimer) { clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
      autoRefreshRunning = false;
      document.getElementById('autoRefreshBtn').textContent = '▶ Resume';
    }

    document.getElementById('levelSelect').addEventListener('change', async (e) => {
      const level = e.target.value;
      try {
        await fetch('/logs/api/level', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ level })
        });
      } catch (err) {}
      loadLogs();
    });

    document.getElementById('autoRefreshBtn').addEventListener('click', () => {
      autoRefreshRunning ? stopAutoRefresh() : startAutoRefresh();
    });

    document.getElementById('refreshBtn').addEventListener('click', () => loadLogs());

    document.getElementById('clearBtn').addEventListener('click', async () => {
      if (!confirm('Clear the log file? This cannot be undone.')) return;
      await fetch('/logs/api/clear', { method: 'DELETE' });
      loadLogs();
    });

    window.addEventListener('beforeunload', () => stopAutoRefresh());

    // Init
    loadLevel().then(() => {
      loadLogs();
      startAutoRefresh();
    });
  </script>
  <footer class="app-footer">
    <span>naviList v<span id="appVersion">…</span></span> · <a href="https://github.com/ofernander/naviList" target="_blank" rel="noopener"><svg class="app-footer-icon" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg> GitHub</a>
  </footer>
  <script>
    fetch('/api/version').then(r => r.json()).then(d => {
      const el = document.getElementById('appVersion');
      if (el) el.textContent = d.version || '?';
    }).catch(() => {});
  </script>
  <script src="/js/theme.js"></script>
</body>
</html>
